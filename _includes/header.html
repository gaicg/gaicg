<header class="site-header" data-site-header>
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.short_title }} home">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span class="brand-text">
        <strong>{{ site.short_title }}</strong>
        <span>Gothenburg Anaesthesia & Intensive Care Group</span>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" data-nav-toggle>
      <span class="sr-only">Toggle navigation</span>
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>

    <nav class="primary-nav" id="primary-navigation" aria-label="Primary navigation" data-primary-nav>
      <ul>
        {% for item in site.data.navigation %}
          {% assign item_url = item.url | relative_url %}
          <li><a href="{{ item_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
