<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0b2746">

  {% assign page_title = page.title | default: site.title %}
  {% if page.title %}
    <title>{{ page.title | escape }} · {{ site.short_title | escape }}</title>
  {% else %}
    <title>{{ site.title | escape }}</title>
  {% endif %}

  {% assign page_description = page.description | default: site.description %}
  <meta name="description" content="{{ page_description | strip_html | normalize_whitespace | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.short_title | escape }}">
  <meta property="og:title" content="{{ page_title | escape }}">
  <meta property="og:description" content="{{ page_description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/og-default.png' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ResearchOrganization",
    "name": {{ site.organization.name | jsonify }},
    "alternateName": {{ site.organization.acronym | jsonify }},
    "url": {{ site.url | append: site.baseurl | jsonify }},
    "description": {{ site.description | jsonify }},
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Gothenburg",
      "addressCountry": "SE"
    }
  }
  </script>
</head>
